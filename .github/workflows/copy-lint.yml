name: self-test
on: [push, pull_request]
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bad samples must fail
        run: |
          if python3 scripts/copy_lint.py tests/bad-samples.md; then
            echo "::error::bad-samples.md passed the linter; a pattern regressed"
            exit 1
          fi
      - name: good samples must pass
        run: python3 scripts/copy_lint.py tests/good-samples.md

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extraction self-test
        run: python3 hooks/grounded_activate.py --self-test
      - name: hook interface suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  hooks-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: extraction self-test
        run: python hooks/grounded_activate.py --self-test
      - name: hook interface suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
