name: self-test
on: [push, pull_request]
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bad samples must fail
        run: |
          status=0
          python3 skills/grounded-copy/scripts/copy_lint.py \
            skills/grounded-copy/tests/bad-samples.md || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::bad-samples.md exited $status; expected 1 (findings)"
            exit 1
          fi
      - name: good samples must pass
        run: python3 skills/grounded-copy/scripts/copy_lint.py skills/grounded-copy/tests/good-samples.md

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: extraction self-test
        run: python3 hooks/grounded_activate.py --self-test
      - name: codex adapter matches the canonical files
        run: python3 scripts/build_codex_adapter.py --check
      - name: hook interface suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  hooks-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: extraction self-test
        run: python hooks/grounded_activate.py --self-test
      - name: codex adapter matches the canonical files
        run: python scripts/build_codex_adapter.py --check
      - name: hook interface suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
